# Zone sections of the RestedXP Forever guides per race and class (guard P9, decision of 2026-11-02).
# Counted with `python3 -m tools.routekit rxp DIR` on the Forever guides of
# github.com/RestedXP/RXPGuides (Guides/forever, commit 1a7324e of 2026-11-01, CC BY-NC-SA 4.0):
# the guides a combination follows from level 1 along `#next`, with their race and class filters,
# up to the end of the chain (`end`, level). Counts only, decision FD-1101: no quest, order or text
# of these guides is in Pathmark. The route may have at most max(sections, start route) zone
# sections up to `end` and the start route's plus limit.p9_sections_extra above
# (tools/routekit/metrics.py).

