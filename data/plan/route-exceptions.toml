# Measured exceptions to the route limits (Welle 6b, docs/ROUTE-METRICS.md §Gate). The CI job "Route
# quality" fails on every breach of a limit, a guard or a hard rule that no entry covers. An entry
# covers one metric in the named modes for the named combinations up to the measured value: `max` for
# a metric that must stay low, `min` for one that must stay high. A route that gets worse than the
# measured value, or a combination the entry does not name, breaks the job. Guards (P3, P4b, P5b,
# P9b, P11b) have no exceptions.

