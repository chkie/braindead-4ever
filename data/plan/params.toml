# SPDX-License-Identifier: GPL-3.0-or-later
# Model parameters and limits of the route simulator (tools/routekit/sim.py) and the route
# metrics (tools/routekit/metrics.py). Our own route logic, no game data.
#
# Every entry names its source. `forever` says whether the value is known to hold in WoW: Forever:
#   "ja"          a Forever source states it (Blizzard, client data, beta measurement),
#   "unbestätigt" a Classic value, an emulator value or a prior of another tool, not measured in
#                 Forever; replaced by our own measurements once the data collector delivers,
#   "gewählt"     our own choice where no source gives a value; the note says why.
# `sd` is the spread the source gives (mean ± sd); only time parameters with a spread are varied
# in the 16 held-out draws (DR 22c §D). Times are model times: the simulator prices a route, it
# does not predict real play time ("Modellstunden", DR 22b §6).
# Reports: .claude/research/2026-10-31-wow-addon/22b-zeit-xp-modell.md (§Modellparameter),
# 22c-optimierungsverfahren.md, 22d-gleichwertigkeit-dynamik.md, 22a-speedrun-methodik.md of the
# Pathmark workspace; plan "Welle 6 Routenbau" of 2026-11-01 (decisions).

