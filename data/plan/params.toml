# --- Optimizer (Welle 6b, tools/routekit/optimize.py) ----------------------------------------------
# Policy of the route optimizer, not game values. The search is counted in tries and rounds, never
# in seconds (brain chapter 21 §4.5). Weights are the brain's objective J (§3.3): model seconds +
# (w_g - 1) x grind + (w_over - w_g) x grind above the share per level.

[opt.weight_settings]
value = [[1.5, 4.0], [1.5, 2.0], [1.3, 1.3], [1.0, 1.0]]
source = "brain chapter 21 §3.2/§3.3: w_g 1.5 (Factoruide) to 2.5 (Polestar), 4 above 10 % grind per level (Factoruide); chosen order from most quests to pure model time"
date = "2026-11-01"
forever = "gewählt"
note = "Pairs (w_g, w_over), each with every arrival margin. The build keeps the first plan that meets the guards P3, P4b, P5b, P9b and P11 against the start route and G7; the weights are policy, the guards are hard."

[opt.beam_width]
value = 8
source = "DR 22c (beam over zone visits); chosen"
date = "2026-11-01"
forever = "gewählt"
note = "Paths kept per depth of the zone-visit search; the depth is the zone-change budget of the start route (guard P9)."

[opt.gate_variants]
value = [[0.0, 0.0], [0.5, 3.0], [1.0, 2.0], [2.0, 1.5], [3.0, 1.0], [5.0, 0.8]]
source = "brain chapter 21 R17/R19 (grind with place and target to open quests); chosen"
date = "2026-11-01"
forever = "gewählt"
note = "Pairs (levels, value): a zone visit may grind up to `levels` levels to open quests worth `value` x the ground XP; (0, 0) = no grind. Every variant is built, the search keeps the cheapest."

[opt.tries_per_quest]
value = 400
source = "brain chapter 21 §4.5 (count tries, not seconds); chosen"
date = "2026-11-01"
forever = "gewählt"
note = "ALNS tries per quest of a block, at least 200 and at most tries_max."

